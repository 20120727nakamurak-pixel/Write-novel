<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4efe6">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.json">
<title>Write-novel v1.3</title>
<style>
:root{
 --bg:#f4efe6;--paper:#fffdf8;--panel:#eee6d9;--text:#39362f;
 --muted:#8b8173;--line:#ded4c4;--accent:#69775b;--accent-dark:#4f5d43;
 --soft:#e7ebdf;--danger:#a65b50;--shadow:0 3px 14px #51432b0b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;font-size:14px}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--text);border-radius:7px;padding:8px 11px}
button:hover{background:var(--panel)}
button.primary{background:var(--accent);color:white;border-color:var(--accent)}
button.primary:hover{background:var(--accent-dark)}
button.danger{color:var(--danger)}
button.ghost{background:transparent;border-color:transparent}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px #69775b1c}
textarea{resize:vertical}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:12px}
.small{font-size:12px}
h1,h2,h3,p{margin-top:0}
h1{font-size:24px;font-weight:650;letter-spacing:-.4px;margin-bottom:6px}
h2{font-size:18px;font-weight:650;margin-bottom:0}
h3{font-size:14px;font-weight:650;margin-bottom:0}
.topbar{height:58px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.brand{font-family:Georgia,serif;font-size:20px;font-weight:bold;letter-spacing:-.5px;color:var(--accent-dark)}
.brand span{font-family:system-ui,sans-serif;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:1px;margin-left:7px}
#saveStatus{font-size:12px;color:var(--muted)}
main{max-width:1500px;margin:auto;padding:25px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.home-menu{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:15px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-width:0}
.card h3{font-family:Georgia,serif;font-size:18px;white-space:nowrap;overflow:hidden;min-width:0}
.project-title{position:relative;overflow:hidden;width:100%;white-space:nowrap}
.project-title span{display:inline-block;white-space:nowrap;max-width:100%}
.project-title.is-marquee span{max-width:none;padding-right:42px;animation:title-marquee 13s linear infinite}
.project-title.is-marquee:hover span{animation-play-state:paused}
@keyframes title-marquee{0%,12%{transform:translateX(0)}88%,100%{transform:translateX(var(--marquee-distance))}}
.card.guide-card{border-color:#cbd4bf;background:#fbfcf8}
.guide-label{display:inline-flex;align-self:flex-start;padding:3px 8px;border-radius:20px;background:var(--soft);color:var(--accent-dark);font-size:11px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:9px;line-height:1.8}
.workspace{height:calc(100vh - 58px);display:flex;flex-direction:column;min-height:500px}
.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:var(--paper);border-bottom:1px solid var(--line);padding:9px 13px}
.toolbar button{font-size:12px;padding:7px 9px}
.project-name{font-weight:700;margin-right:auto;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:4px}
.tab{border:0;background:transparent;color:var(--muted)}
.tab.active{background:var(--soft);color:var(--accent-dark);font-weight:700}
.editor-layout{display:grid;grid-template-columns:220px minmax(260px,1fr);gap:11px;padding:11px;flex:1;min-height:0;position:relative}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow)}
.panel-head{padding:11px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel-body{padding:11px;overflow:auto;min-height:0}
.episode-list{display:flex;flex-direction:column;gap:5px}
.episode-item{display:flex;gap:4px}
.episode-item button:first-child{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selected{background:var(--soft);color:var(--accent-dark);border-color:#d5ddc9}
.editor{display:flex;flex-direction:column;min-height:0}
#episodeTitle{font-size:20px;font-weight:700;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:15px;background:var(--paper)}
#bodyEditor{flex:1;min-height:150px;border:0;border-radius:0;padding:20px;background:var(--paper);font-family:ui-serif,"Yu Mincho",serif;font-size:17px;line-height:1.95}
.footer{padding:8px 13px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.reference-panel{position:absolute;right:11px;top:11px;bottom:11px;width:320px;z-index:3;box-shadow:0 8px 30px #453a2815}
.reference-tabs{display:flex;gap:5px;align-items:center}
.reference-tabs button{font-size:11px;padding:6px 8px}
.reference-tabs button.active{background:var(--soft);color:var(--accent-dark);border-color:#d5ddc9}
.reference-result{padding:10px;border:1px solid var(--line);border-radius:8px;margin:8px 0;cursor:pointer;background:var(--paper)}
.reference-result:hover{background:var(--panel)}
.reference-result strong{display:block;margin-bottom:4px}
#referenceDetail,#referenceEpisodeBody{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.8;margin-top:12px}
#referenceEpisodeBody{font-family:ui-serif,"Yu Mincho",serif}
.settings-page{padding:16px;overflow:auto;flex:1}
.settings-layout{display:grid;grid-template-columns:210px minmax(280px,1fr);gap:13px;max-width:1250px;margin:auto;align-items:start}
.settings-box{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.category-button{display:block;width:100%;text-align:left;border:0;border-radius:0}
.category-button.active{background:var(--soft);color:var(--accent-dark)}
.category-list{padding:5px 0}
.settings-main{min-width:0}
.settings-main-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}
.settings-main-head h2{font-size:17px}
.entry-list{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px}
.entry-row{display:flex;align-items:center;gap:5px;padding:5px;border:1px solid var(--line);border-radius:8px;background:#fffefa;min-width:0}
.entry-row.active{border-color:#b8c5aa;background:var(--soft)}
.entry-row .entry-select{flex:1;min-width:0;text-align:left;border:0;background:transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.entry-row .entry-select:hover{background:transparent}
.entry-row .entry-delete{flex:none;padding:5px 8px;color:var(--danger);border-color:transparent;background:transparent}
.entry-editor{border-top:1px solid var(--line);padding:17px 18px;background:#fffefa}
.entry-editor-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.entry-editor-top h3{font-size:14px}
.editor-form{max-width:850px}
.field{margin:12px 0}
.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
.field textarea{min-height:95px;line-height:1.7}
.setting-field{padding:13px 0;border-top:1px solid #eee7dc}
.setting-field:first-child{border-top:0}
.setting-field-actions{display:flex;justify-content:flex-end;margin-top:7px}
.add-field-row{margin-top:13px}
.entry-editor-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.settings-empty{padding:22px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
.memo-page{padding:22px;overflow:auto;flex:1}
.memo-wrap{max-width:1000px;margin:auto}
.memo-wrap textarea{min-height:35vh;line-height:1.8;font-family:ui-serif,"Yu Mincho",serif}
.modal-bg{position:fixed;inset:0;background:#28251f66;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}
.modal{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(650px,100%);max-height:88vh;overflow:auto;box-shadow:0 15px 50px #0002}
.modal h2{margin-bottom:16px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.modal-field{margin:12px 0}
.modal-field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
.result-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.search-hit{padding:10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.search-hit:hover{background:var(--panel)}
.search-hit strong{display:block;margin-bottom:5px}
.search-snippet{font-size:12px;color:var(--muted);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
kbd{font-family:inherit;font-size:11px;padding:2px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--panel)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;background:var(--accent-dark);color:white;padding:10px 15px;border-radius:8px;font-size:12px}
mark{background:#e8dfb8;color:inherit}
.guide-notice{padding:9px 13px;background:var(--soft);color:var(--accent-dark);font-size:12px;border-bottom:1px solid var(--line)}
.guide-content{white-space:pre-wrap;overflow-wrap:anywhere}
.intro-screen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:var(--bg);overflow:hidden}
.intro-title{display:inline-block;font-family:Georgia,serif;font-size:clamp(34px,7vw,62px);font-weight:bold;letter-spacing:-1.5px;color:var(--accent-dark);white-space:nowrap;transform-origin:center center;will-change:transform,opacity}
.intro-title::after{content:"";display:inline-block;width:2px;height:.88em;margin-left:5px;vertical-align:-.08em;background:var(--accent-dark);animation:intro-caret .8s steps(1,end) infinite}
.intro-screen.is-zooming .intro-title{animation:intro-zoom .9s cubic-bezier(.2,.72,.25,1) forwards}
.intro-screen.is-hidden{display:none}
@keyframes intro-caret{50%{opacity:0}}
@keyframes intro-zoom{0%{transform:scale(1);opacity:1;filter:blur(0)}65%{opacity:1}100%{transform:scale(24);opacity:0;filter:blur(3px)}}
@media(prefers-reduced-motion:reduce){.intro-title::after{animation:none}.intro-screen.is-zooming .intro-title{animation:intro-zoom .15s ease-out forwards}}
.trash-button{box-shadow:0 3px 12px #51432b12}
.trash-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.trash-row:last-child{border-bottom:0}
.trash-info{min-width:0;flex:1}
.trash-info strong{display:block;overflow-wrap:anywhere;margin-bottom:4px}
.trash-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.shared-note{padding:10px 13px;background:var(--soft);color:var(--accent-dark);border-bottom:1px solid var(--line);font-size:12px;line-height:1.7}
@media(max-width:850px){
 .editor-layout{grid-template-columns:170px minmax(200px,1fr)}
 .reference-panel{width:min(330px,90vw)}
 .settings-layout{grid-template-columns:180px minmax(260px,1fr)}
}
@media(max-width:600px){
 main{padding:14px}
 .head{align-items:flex-start;flex-direction:column}
 .editor-layout{grid-template-columns:1fr;grid-template-rows:135px minmax(280px,1fr)}
 .episode-list{flex-direction:row;overflow:auto}
 .episode-item{min-width:150px}
 .settings-layout{grid-template-columns:1fr}
 .settings-category-box .category-list{display:flex;overflow:auto}
 .settings-category-box .category-button{width:auto;white-space:nowrap}
 .settings-main-head{align-items:flex-start}
 .entry-list{grid-template-columns:1fr}
 .workspace{height:calc(100vh - 58px)}
 .toolbar{gap:5px}
 .project-name{max-width:100px}
 .trash-row{flex-direction:column}
 .trash-actions{justify-content:flex-start}
 .home-menu{width:100%;justify-content:flex-end}
}
</style>
</head>
<body>
<div id="introScreen" class="intro-screen" aria-label="Write-novel 起動中">
 <div id="introTitle" class="intro-title" aria-label="Write-novel"></div>
</div>

<header class="topbar">
 <div class="brand">Write-novel <span>v1.3</span></div>
 <div id="saveStatus">保存済み</div>
</header>

<main id="homeView">
 <div class="head">
  <div>
   <h1>作品ホーム</h1>
   <div class="muted">作品を選んで執筆を始めよう。</div>
  </div>
  <div class="home-menu">
   <button onclick="openSharedSettings()">全作品共有設定</button>
   <button class="trash-button" onclick="openTrash()">ゴミ箱 <span id="trashCount">0</span></button>
   <button class="primary" onclick="createProject()">＋ 新しい作品</button>
  </div>
 </div>
 <div id="projectGrid" class="grid"></div>
</main>

<section id="workspace" class="workspace hidden">
 <div class="toolbar">
  <button onclick="showHome()">← ホーム</button>
  <div id="projectName" class="project-name"></div>
  <div class="tabs">
   <button id="writingTab" class="tab active" onclick="switchTab('writing')">執筆</button>
   <button id="settingsTab" class="tab" onclick="switchTab('settings')">設定</button>
   <button id="memoTab" class="tab" onclick="switchTab('memo')">メモ</button>
  </div>
  <button id="referenceToggle" onclick="toggleReference()">参照パネル</button>
  <button id="globalSearchButton" onclick="openGlobalSearch()">横断検索</button>
  <button id="bulkReplaceButton" onclick="openBulkReplace()">一括置換</button>
  <button id="historyButton" onclick="openHistory()">履歴</button>
  <button onclick="openShortcuts()">ショートカット</button>
  <button id="exportJSONButton" onclick="exportJSON()">JSON保存</button>
  <button id="exportTXTButton" onclick="exportTXT()">TXT保存</button>
  <button id="importJSONButton" onclick="$('importFile').click()">JSON読込</button>
  <input id="importFile" type="file" accept=".json,application/json" class="hidden">
 </div>

 <div id="guideNotice" class="guide-notice hidden">これはWrite-novelの使い方を紹介するガイド作品です。内容の編集・削除はできません。</div>

 <div id="writingView" class="editor-layout">
  <aside class="panel">
   <div class="panel-head"><h3>エピソード</h3><button id="addEpisodeButton" onclick="addEpisode()">＋</button></div>
   <div class="panel-body"><div id="episodeList" class="episode-list"></div></div>
  </aside>
  <section class="panel editor">
   <input id="episodeTitle" placeholder="エピソードタイトル">
   <textarea id="bodyEditor" placeholder="ここから執筆…" spellcheck="false"></textarea>
   <div class="footer"><span id="wordCount">0文字</span><span id="episodeSaveStatus">自動保存</span></div>
  </section>
  <aside id="referencePanel" class="panel reference-panel hidden">
   <div class="panel-head">
    <div class="reference-tabs">
     <button id="refSettingsTab" class="active" onclick="switchReferenceTab('settings')">設定検索</button>
     <button id="refEpisodesTab" onclick="switchReferenceTab('episodes')">話を参照</button>
    </div>
    <button class="ghost" onclick="toggleReference(false)">×</button>
   </div>
   <div class="panel-body">
    <div id="referenceSettingsPane">
     <input id="referenceSearch" placeholder="設定名・内容を検索">
     <div id="referenceResults"></div><div id="referenceDetail"></div>
    </div>
    <div id="referenceEpisodesPane" class="hidden">
     <select id="referenceEpisodeSelect"></select>
     <h3 id="referenceEpisodeTitle" style="margin-top:12px">エピソード参照</h3>
     <div id="referenceEpisodeBody" class="muted">別のエピソードを選択してください。</div>
    </div>
   </div>
  </aside>
 </div>

 <section id="settingsView" class="settings-page hidden">
  <div class="settings-layout">
   <aside class="settings-box settings-category-box">
    <div class="panel-head"><h3>カテゴリ</h3><button id="addCategoryButton" onclick="addCategory()">＋</button></div>
    <div id="categoryList" class="category-list"></div>
   </aside>
   <section class="settings-box settings-main">
    <div class="settings-main-head"><h2 id="settingsHeading">人物</h2><button id="addEntryButton" class="primary" onclick="addEntry()">＋ 資料を追加</button></div>
    <div id="entryList" class="entry-list"></div><div id="entryEditor" class="entry-editor hidden"></div>
   </section>
  </div>
 </section>

 <section id="memoView" class="memo-page hidden">
  <div class="memo-wrap">
   <h2>執筆メモ</h2>
   <p class="muted" style="margin:7px 0 18px">作品全体のアイデア、伏線、展開案など。</p>
   <div class="field"><label>作品全体のメモ</label><textarea id="projectMemo" placeholder="物語全体についてのメモ…"></textarea></div>
   <div class="field"><label id="episodeMemoLabel">エピソード別メモ</label><textarea id="episodeMemo" placeholder="このエピソードの修正予定や展開案…"></textarea></div>
  </div>
 </section>
</section>

<div id="modalRoot"></div><div id="toastRoot"></div>

<script>
"use strict";
const KEY="write-novel-v03";
const BACKUP_KEY="write-novel-v04-backup";
const GUIDE_ID="write-novel-guide-v11";
const TRASH_KEY="write-novel-v12-trash";
const SHARED_KEY="write-novel-v13-shared-settings";
const TRASH_MAX=10,TRASH_DAYS=10;
let projects=load(),trash=loadTrash(),sharedData=loadShared();
let projectId=null,episodeId=null,categoryId=null,entryId=null;
let saveTimer=null,referenceOpen=false,referenceTab="settings",referenceEpisodeId=null;
let historyData={};
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const timestamp=()=>new Date().toISOString();
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY)||"[]");if(Array.isArray(raw))return raw;if(raw&&Array.isArray(raw.projects))return raw.projects;return []}catch{return []}}
function loadTrash(){try{const d=JSON.parse(localStorage.getItem(TRASH_KEY)||"[]");return Array.isArray(d)?d:[]}catch{return []}}
function loadShared(){
 try{
  const d=JSON.parse(localStorage.getItem(SHARED_KEY)||"null");
  if(d&&Array.isArray(d.categories))return d;
 }catch{}
 return {categories:[{id:uid(),name:"共通人物",entries:[]},{id:uid(),name:"共通世界観",entries:[]}]};
}
function saveShared(){try{localStorage.setItem(SHARED_KEY,JSON.stringify(sharedData))}catch{alert("共有設定を保存できませんでした。ブラウザの保存領域を確認してください。")}}
function saveTrash(){localStorage.setItem(TRASH_KEY,JSON.stringify(trash));updateTrashCount()}
function pruneTrash(){
 const cutoff=Date.now()-TRASH_DAYS*86400000;
 trash=trash.filter(i=>Date.parse(i.deletedAt)>cutoff);
 trash.sort((a,b)=>Date.parse(a.deletedAt)-Date.parse(b.deletedAt));
 while(trash.length>TRASH_MAX)trash.shift();
 saveTrash();
}
function addToTrash(type,label,data,meta={}){
 pruneTrash();
 trash.push({id:uid(),type,label:String(label||"削除データ"),data:JSON.parse(JSON.stringify(data)),meta,deletedAt:timestamp()});
 trash.sort((a,b)=>Date.parse(a.deletedAt)-Date.parse(b.deletedAt));
 while(trash.length>TRASH_MAX)trash.shift();
 saveTrash();
}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(projects));$("saveStatus").textContent="保存済み";if($("episodeSaveStatus"))$("episodeSaveStatus").textContent="保存済み"}
 catch{$("saveStatus").textContent="保存失敗";alert("保存領域が不足しています。JSONバックアップを取ってください。")}
}
function scheduleSave(){if(isGuideProject())return;$("episodeSaveStatus").textContent="保存中…";clearTimeout(saveTimer);saveTimer=setTimeout(()=>save(true),300)}
function p(){return projects.find(x=>x.id===projectId)}
function ep(){return p()?.episodes.find(x=>x.id===episodeId)}
function cat(){return p()?.categories.find(x=>x.id===categoryId)}
function ent(){return cat()?.entries.find(x=>x.id===entryId)}
function isGuideProject(){return projectId===GUIDE_ID}
function freshProject(name){return{id:uid(),name,createdAt:timestamp(),episodes:[{id:uid(),title:"第1話",body:"",notes:"",memo:""}],categories:[{id:uid(),name:"人物",entries:[]},{id:uid(),name:"世界観",entries:[]}],plot:"",memo:""}}
function createGuideProject(){
 const chapters=[
 ["はじめに","Write-novelへようこそ。\n\n小説の執筆と作品資料の管理をひとつにまとめたツールです。\n\n作品ごとにエピソードを書き、人物や世界観などの資料を整理できます。入力内容はブラウザ内に自動保存されます。定期的にJSON保存でバックアップしてください。"],
 ["作品ホーム","ホーム画面では作品を一覧管理できます。\n\n「新しい作品」で作品を作成し、「開く」で執筆画面へ移動します。「名前変更」で作品名を変更できます。\n\n削除した作品はゴミ箱へ移動します。ゴミ箱内のデータは10日間保持され、最大10件まで保存されます。"],
 ["執筆機能","左側のエピソード一覧から話を切り替えられます。「＋」で追加し、「×」でゴミ箱へ移動します。最後の1話は削除できません。\n\nタイトルと本文は自動保存されます。"],
 ["設定資料","設定画面では人物や世界観などの資料を管理できます。\n\nカテゴリを作成し、資料を追加して、項目名と内容を登録します。資料や項目を削除するとゴミ箱へ移動します。"],
 ["全作品共有設定","ホーム画面上部の「全作品共有設定」から開きます。\n\nここに登録した資料は特定の作品に属さず、すべての作品で共通して参照・編集できます。共通人物、共通世界観、用語集などに利用できます。作品ごとの設定資料とは別に保存されます。"],
 ["参照パネル","執筆画面上部の「参照パネル」から、設定資料や別エピソードを確認できます。"],
 ["検索・置換","横断検索で本文や設定資料を検索できます。一括置換では本文や設定資料の文字列をまとめて置換できます。"],
 ["履歴・バックアップ","履歴では現在のエピソード本文を保存できます。JSON保存・TXT保存で作品データを書き出し、JSON読込で作品データを追加できます。"],
 ["メモ・ショートカット","メモ画面では作品全体とエピソード別のメモを管理できます。\n\n保存：⌘ + S\n横断検索：⌘ + ⇧ + F\n新規エピソード：⌘ + ⇧ + Enter\n前後のエピソード：⌘ + ⇧ + ↑ / ↓\n参照パネル：⌘ + ⇧ + R\nショートカット一覧：⌘ + ⇧ + K"]
 ];
 return{id:GUIDE_ID,name:"Write-novelの使い方",createdAt:timestamp(),isGuide:true,episodes:chapters.map(c=>({id:uid(),title:c[0],body:c[1],notes:"",memo:""})),categories:[],plot:"",memo:""};
}
function ensureGuideProject(){
 const i=projects.findIndex(x=>x.id===GUIDE_ID);
 if(i<0)projects.unshift(createGuideProject());
 else{const old=projects[i],g=createGuideProject();g.createdAt=old.createdAt||timestamp();projects.splice(i,1);projects.unshift(g)}
}
function normalizeProject(x){
 if(!x||typeof x!=="object")return null;
 x.id||=uid();x.name||="無題の作品";
 if(!Array.isArray(x.episodes))x.episodes=[];
 if(!Array.isArray(x.categories))x.categories=[];
 x.plot=typeof x.plot==="string"?x.plot:"";x.memo=typeof x.memo==="string"?x.memo:"";
 x.episodes.forEach(e=>{e.id||=uid();e.title??="無題";e.body=typeof e.body==="string"?e.body:"";e.notes=typeof e.notes==="string"?e.notes:"";e.memo=typeof e.memo==="string"?e.memo:e.notes});
 x.categories.forEach(c=>{c.id||=uid();c.name||="その他";if(!Array.isArray(c.entries))c.entries=[];c.entries.forEach(e=>{e.id||=uid();e.title||="無題の設定";if(!Array.isArray(e.fields))e.fields=[];e.fields.forEach(f=>{f.name??="項目";f.value=typeof f.value==="string"?f.value:""})})});
 if(!x.episodes.length)x.episodes.push({id:uid(),title:"第1話",body:"",notes:"",memo:""});
 return x;
}
function showToast(message){$("toastRoot").innerHTML=`<div class="toast">${esc(message)}</div>`;setTimeout(()=>$("toastRoot").innerHTML="",2400)}
function updateTrashCount(){const el=$("trashCount");if(el)el.textContent=trash.length}

/* ホーム画面 */
function renderHome(){
 $("homeView").classList.remove("hidden");$("workspace").classList.add("hidden");
 $("projectGrid").innerHTML=projects.length?projects.map(x=>{
  const guide=x.id===GUIDE_ID;
  return `<article class="card ${guide?"guide-card":""}">
   ${guide?'<span class="guide-label">使い方ガイド</span>':""}
   <h3 class="project-title" title="${esc(x.name)}"><span>${esc(x.name)}</span></h3>
   <div class="muted">${x.episodes.length} エピソード</div>
   <div class="muted">${x.categories.reduce((n,c)=>n+c.entries.length,0)} 設定資料</div>
   <div class="actions"><button class="primary" onclick="openProject('${x.id}')">開く</button>
   ${guide?"":`<button onclick="renameProject('${x.id}')">名前変更</button><button class="danger" onclick="deleteProject('${x.id}')">削除</button>`}</div>
  </article>`;
 }).join(""):'<div class="empty">作品はまだありません。</div>';
 requestAnimationFrame(()=>document.querySelectorAll(".project-title").forEach(el=>{
  const span=el.querySelector("span");if(!span)return;
  const overflow=span.scrollWidth-el.clientWidth;
  if(overflow>10){el.classList.add("is-marquee");span.style.setProperty("--marquee-distance",`${-overflow}px`)}
 }));
 updateTrashCount();
}
function createProject(){
 showModal("新しい作品",`<div class="modal-field"><label>作品名</label><input id="newProjectName" placeholder="作品名を入力"></div>`,()=>{
  const name=$("newProjectName").value.trim();if(!name)return false;
  const x=freshProject(name);projects.unshift(x);save();openProject(x.id);
 });
}
function renameProject(id){
 if(id===GUIDE_ID)return;const x=projects.find(a=>a.id===id);if(!x)return;
 showModal("作品名変更",`<div class="modal-field"><label>作品名</label><input id="renameProjectInput" value="${esc(x.name)}"></div>`,()=>{
  const name=$("renameProjectInput").value.trim();if(!name)return false;
  x.name=name;save();renderHome();if(id===projectId)$("projectName").textContent=x.name;
 });
}
function deleteProject(id){
 if(id===GUIDE_ID)return;const x=projects.find(a=>a.id===id);if(!x)return;
 confirmAction(`「${x.name}」をゴミ箱へ移動しますか？`,()=>{
  const index=projects.findIndex(a=>a.id===id);
  addToTrash("project",x.name,x,{index});projects=projects.filter(a=>a.id!==id);
  save();renderHome();showToast("作品をゴミ箱へ移動しました");
 });
}
function setGuideMode(){
 const guide=isGuideProject();$("guideNotice").classList.toggle("hidden",!guide);
 ["addEpisodeButton","addCategoryButton","addEntryButton","globalSearchButton","bulkReplaceButton","historyButton","exportJSONButton","exportTXTButton","importJSONButton"].forEach(id=>$(id).classList.toggle("hidden",guide));
 $("episodeTitle").readOnly=guide;$("bodyEditor").readOnly=guide;$("projectMemo").readOnly=guide;$("episodeMemo").readOnly=guide;
}
function openProject(id){
 saveEditor(false);projectId=id;const x=p();if(!x)return;
 normalizeProject(x);episodeId=x.episodes[0]?.id||null;categoryId=x.categories[0]?.id||null;entryId=null;referenceEpisodeId=null;
 $("homeView").classList.add("hidden");$("workspace").classList.remove("hidden");
 $("projectName").textContent=x.name;setGuideMode();switchTab("writing");
 renderEpisodes();loadEditor();renderCategories();renderReferences();renderMemo();toggleReference(false);
}
function showHome(){saveEditor(false);save();renderHome()}
function switchTab(tab){
 $("writingView").classList.toggle("hidden",tab!=="writing");$("settingsView").classList.toggle("hidden",tab!=="settings");$("memoView").classList.toggle("hidden",tab!=="memo");
 $("writingTab").classList.toggle("active",tab==="writing");$("settingsTab").classList.toggle("active",tab==="settings");$("memoTab").classList.toggle("active",tab==="memo");
 if(tab==="settings")renderCategories();if(tab==="memo")renderMemo();
}

/* エピソード */
function saveEditor(autosave=true){
 if(isGuideProject())return;const e=ep();if(!e)return;
 e.title=$("episodeTitle").value;e.body=$("bodyEditor").value;e.updatedAt=timestamp();
 $("wordCount").textContent=e.body.length.toLocaleString()+"文字";if(autosave)scheduleSave();
}
function loadEditor(){const e=ep();$("episodeTitle").value=e?.title||"";$("bodyEditor").value=e?.body||"";$("wordCount").textContent=$("bodyEditor").value.length.toLocaleString()+"文字"}
$("episodeTitle").addEventListener("input",()=>{saveEditor();renderEpisodes();renderReferenceEpisodeOptions()});
$("bodyEditor").addEventListener("input",()=>saveEditor());
function renderEpisodes(){
 const x=p();if(!x)return;
 $("episodeList").innerHTML=x.episodes.map(e=>`<div class="episode-item"><button class="${e.id===episodeId?"selected":""}" onclick="selectEpisode('${e.id}')">${esc(e.title||"無題")}</button>${isGuideProject()?"":`<button title="ゴミ箱へ移動" onclick="deleteEpisode('${e.id}')">×</button>`}</div>`).join("");
}
function selectEpisode(id){saveEditor(false);episodeId=id;loadEditor();renderEpisodes();renderMemo();renderReferenceEpisodeOptions();scheduleSave()}
function addEpisode(){
 if(isGuideProject())return;saveEditor(false);const x=p();
 const e={id:uid(),title:`第${x.episodes.length+1}話`,body:"",notes:"",memo:""};
 x.episodes.push(e);episodeId=e.id;loadEditor();renderEpisodes();renderMemo();renderReferenceEpisodeOptions();scheduleSave();
}
function deleteEpisode(id){
 if(isGuideProject())return;const x=p();if(x.episodes.length<2){showToast("最後のエピソードは削除できません");return}
 const target=x.episodes.find(e=>e.id===id);if(!target)return;
 confirmAction("このエピソードをゴミ箱へ移動しますか？",()=>{
  const index=x.episodes.findIndex(e=>e.id===id);
  addToTrash("episode",target.title||"無題のエピソード",target,{projectId:x.id,index});
  x.episodes=x.episodes.filter(e=>e.id!==id);if(episodeId===id)episodeId=x.episodes[0].id;
  loadEditor();renderEpisodes();renderMemo();renderReferenceEpisodeOptions();scheduleSave();showToast("エピソードをゴミ箱へ移動しました");
 });
}

/* 参照パネル */
function toggleReference(force){referenceOpen=typeof force==="boolean"?force:!referenceOpen;$("referencePanel").classList.toggle("hidden",!referenceOpen);if(referenceOpen)renderReferences()}
function switchReferenceTab(tab){
 referenceTab=tab;$("refSettingsTab").classList.toggle("active",tab==="settings");$("refEpisodesTab").classList.toggle("active",tab==="episodes");
 $("referenceSettingsPane").classList.toggle("hidden",tab!=="settings");$("referenceEpisodesPane").classList.toggle("hidden",tab!=="episodes");
 if(tab==="episodes")renderReferenceEpisodeOptions();
}
$("referenceSearch").addEventListener("input",renderReferences);
function renderReferences(){
 const x=p();if(!x)return;const q=$("referenceSearch").value.trim().toLowerCase(),hits=[];
 x.categories.forEach(c=>c.entries.forEach(e=>{const text=[c.name,e.title,...e.fields.flatMap(f=>[f.name,f.value])].join(" ");if(!q||text.toLowerCase().includes(q))hits.push({c,e})}));
 $("referenceResults").innerHTML=hits.map(h=>`<div class="reference-result" onclick="showReference('${h.e.id}')"><strong>${esc(h.e.title)}</strong><span class="muted">${esc(h.c.name)}</span></div>`).join("")||'<div class="muted" style="margin-top:12px">該当する設定はありません。</div>';
}
function showReference(id){const e=p().categories.flatMap(c=>c.entries).find(e=>e.id===id);if(!e)return;$("referenceDetail").textContent=e.title+"\n\n"+e.fields.map(f=>f.name+"\n"+f.value).join("\n\n")}
function renderReferenceEpisodeOptions(){
 const x=p();if(!x)return;const select=$("referenceEpisodeSelect"),options=x.episodes.filter(e=>e.id!==episodeId);select.innerHTML="";
 if(!options.length){select.innerHTML='<option value="">参照できる別エピソードがありません</option>';referenceEpisodeId=null;$("referenceEpisodeTitle").textContent="エピソード参照";$("referenceEpisodeBody").textContent="別のエピソードを作成すると、ここで参照できます。";return}
 if(!options.some(e=>e.id===referenceEpisodeId))referenceEpisodeId=options[0].id;
 options.forEach(e=>{const opt=document.createElement("option");opt.value=e.id;opt.textContent=e.title||"無題";select.appendChild(opt)});
 select.value=referenceEpisodeId;renderReferenceEpisode();
}
function renderReferenceEpisode(){const e=p()?.episodes.find(e=>e.id===referenceEpisodeId);if(!e)return;$("referenceEpisodeTitle").textContent=e.title||"無題";$("referenceEpisodeBody").textContent=e.body||"本文はまだありません。"}
$("referenceEpisodeSelect").addEventListener("change",()=>{referenceEpisodeId=$("referenceEpisodeSelect").value;renderReferenceEpisode()});
/* 作品ごとの設定資料 */
function addCategory(){
 if(isGuideProject())return;
 showModal("カテゴリ追加",`<div class="modal-field"><label>カテゴリ名</label><input id="newCategoryName" placeholder="カテゴリ名"></div>`,()=>{
  const name=$("newCategoryName").value.trim();if(!name)return false;
  if(p().categories.some(c=>c.name===name)){showToast("同名のカテゴリがあります");return false}
  const c={id:uid(),name,entries:[]};p().categories.push(c);categoryId=c.id;entryId=null;renderCategories();scheduleSave();
 });
}
function renderCategories(){
 const x=p();if(!x)return;
 if(!x.categories.some(c=>c.id===categoryId))categoryId=x.categories[0]?.id||null;
 $("categoryList").innerHTML=x.categories.map(c=>`<button class="category-button ${c.id===categoryId?"active":""}" onclick="selectCategory('${c.id}')">${esc(c.name)} (${c.entries.length})</button>`).join("")||'<div class="empty">カテゴリがありません。</div>';
 renderEntryList();
}
function selectCategory(id){categoryId=id;entryId=null;renderCategories()}
function addEntry(){
 if(isGuideProject())return;const c=cat();if(!c){showToast("先にカテゴリを作成してください");return}
 const e={id:uid(),title:"新しい設定",fields:[{name:"概要",value:""}]};
 c.entries.push(e);entryId=e.id;renderEntryList();renderEntryEditor();renderReferences();scheduleSave();
}
function renderEntryList(){
 const c=cat();$("settingsHeading").textContent=c?.name||"設定資料";
 if(!c){$("entryList").innerHTML='<div class="settings-empty">カテゴリを選択してください。</div>';$("entryEditor").classList.add("hidden");return}
 $("entryList").innerHTML=c.entries.map(e=>`<div class="entry-row ${e.id===entryId?"active":""}">
  <button class="entry-select" onclick="selectEntry('${e.id}')">${esc(e.title||"無題")}</button>
  ${isGuideProject()?"":`<button class="entry-delete" title="ゴミ箱へ移動" onclick="deleteEntry('${e.id}')">×</button>`}
 </div>`).join("")||'<div class="settings-empty">資料はまだありません。「＋ 資料を追加」から作成できます。</div>';
 $("entryEditor").classList.toggle("hidden",!entryId);
}
function selectEntry(id){entryId=id;renderEntryList();renderEntryEditor()}
function renderEntryEditor(){
 const e=ent(),box=$("entryEditor");if(!e){box.classList.add("hidden");box.innerHTML="";return}
 box.classList.remove("hidden");
 box.innerHTML=`<div class="entry-editor-top"><h3>資料の編集</h3><span class="muted">入力内容は自動保存されます</span></div>
 <div class="editor-form">
  <div class="field"><label>設定名</label><input id="entryTitleInput" value="${esc(e.title)}" placeholder="設定名を入力"></div>
  <div id="fields">${e.fields.map((f,i)=>`<div class="setting-field">
   <div class="field"><label>項目名</label><input data-i="${i}" data-k="name" value="${esc(f.name)}" placeholder="項目名"></div>
   <div class="field"><label>内容</label><textarea data-i="${i}" data-k="value" rows="4" placeholder="内容を入力">${esc(f.value)}</textarea></div>
   <div class="setting-field-actions"><button class="danger" onclick="removeField(${i})">項目を削除</button></div>
  </div>`).join("")}</div>
  <div class="add-field-row"><button onclick="addField()">＋ 項目を追加</button></div>
  ${isGuideProject()?"":`<div class="entry-editor-actions"><button class="primary" onclick="saveEntry()">保存</button></div>`}
 </div>`;
 if(isGuideProject()){$("entryTitleInput").readOnly=true;box.querySelectorAll("[data-i]").forEach(el=>el.readOnly=true);return}
 $("entryTitleInput").addEventListener("input",ev=>{e.title=ev.target.value;renderEntryList();renderReferences();scheduleSave()});
 box.querySelectorAll("[data-i]").forEach(el=>el.addEventListener("input",()=>{e.fields[+el.dataset.i][el.dataset.k]=el.value;renderReferences();scheduleSave()}));
}
function saveEntry(){
 if(isGuideProject())return;const e=ent();if(!e)return;
 e.title=$("entryTitleInput").value.trim()||"無題の設定";
 e.fields=[...$("entryEditor").querySelectorAll("[data-i][data-k='name']")].map((n,i)=>({name:n.value,value:$("entryEditor").querySelector(`[data-i="${i}"][data-k="value"]`)?.value||""}));
 renderEntryList();renderEntryEditor();renderReferences();scheduleSave();showToast("設定資料を保存しました");
}
function addField(){if(isGuideProject())return;const e=ent();if(!e)return;e.fields.push({name:"項目",value:""});renderEntryEditor();scheduleSave()}
function removeField(i){
 if(isGuideProject())return;const e=ent();if(!e||!e.fields[i])return;
 confirmAction("この項目をゴミ箱へ移動しますか？",()=>{
  const field=e.fields[i];addToTrash("field",field.name||"設定項目",field,{projectId,categoryId,entryId,index:i});
  e.fields.splice(i,1);renderEntryEditor();renderReferences();scheduleSave();showToast("項目をゴミ箱へ移動しました");
 });
}
function deleteEntry(id){
 if(isGuideProject())return;const c=cat();if(!c)return;const target=c.entries.find(e=>e.id===id);if(!target)return;
 confirmAction("この設定資料をゴミ箱へ移動しますか？",()=>{
  const index=c.entries.findIndex(e=>e.id===id);
  addToTrash("entry",target.title||"設定資料",target,{projectId,categoryId,index});
  c.entries=c.entries.filter(e=>e.id!==id);entryId=null;renderEntryList();renderEntryEditor();renderReferences();scheduleSave();showToast("設定資料をゴミ箱へ移動しました");
 });
}

/* 全作品共有設定 */

function sharedEnt(){return sharedCat()?.entries.find(e=>e.id===sharedEntryId)}

 renderSharedSettings();
 showModal("全作品共有設定",`

  <div class="settings-layout" style="grid-template-columns: minmax(120px, .7fr) minmax(220px, 1.5fr);gap:10px">

    <div id="sharedCategoryList" class="category-list"></div>
   </aside>
   <section class="settings-box">

 const c=sharedCat();$("sharedHeading").textContent=c?.name||"共有資料";

 showModal("共有カテゴリ追加",`<div class="modal-field"><label>カテゴリ名</label><input id="sharedNewCategory" placeholder="例：共通人物・用語集"></div>`,()=>{

function selectSharedCategory(id){sharedCategoryId=id;sharedEntryId=null;renderSharedSettings()}
function addSharedEntry(){
 const c=sharedCat();if(!c){showToast("先にカテゴリを作成してください");return}
 const e={id:uid(),title:"新しい共有資料",fields:[{name:"概要",value:""}]};
 c.entries.push(e);sharedEntryId=e.id;saveShared();renderSharedSettings();

function selectSharedEntry(id){sharedEntryId=id;renderSharedSettings()}
function renderSharedEntryEditor(){
 const e=sharedEnt(),box=$("sharedEntryEditor");if(!e)return;
 box.classList.remove("hidden");
 box.innerHTML=`<div class="entry-editor-top"><h3>共有資料の編集</h3><span class="muted">全作品に反映されます</span></div>
  <div class="editor-form">
   <div class="field"><label>資料名</label><input id="sharedTitle" value="${esc(e.title)}"></div>
   <div id="sharedFields">${e.fields.map((f,i)=>`<div class="setting-field">

    <div class="field"><label>内容</label><textarea data-shared-i="${i}" data-shared-k="value" rows="4">${esc(f.value)}</textarea></div>
    <div class="setting-field-actions"><button class="danger" onclick="removeSharedField(${i})">項目を削除</button></div>
   </div>`).join("")}</div>
   <div class="add-field-row"><button id="sharedAddField">＋ 項目を追加</button></div>
   <div class="entry-editor-actions"><button class="primary" id="sharedSaveEntry">保存</button></div>
  </div>`;
 $("sharedTitle").addEventListener("input",ev=>{e.title=ev.target.value;saveShared();renderSharedEntryTitle()});
 box.querySelectorAll("[data-shared-i]").forEach(el=>el.addEventListener("input",()=>{
  e.fields[+el.dataset.sharedI][el.dataset.sharedK]=el.value;saveShared();
 }));
 $("sharedAddField").onclick=()=>{
  e.fields.push({name:"項目",value:""});saveShared();renderSharedEntryEditor();
 };
 $("sharedSaveEntry").onclick=()=>{
  e.title=$("sharedTitle").value.trim()||"無題の共有資料";
  e.fields=[...box.querySelectorAll("[data-shared-i][data-shared-k='name']")].map((n,i)=>({name:n.value,value:box.querySelector(`[data-shared-i="${i}"][data-shared-k="value"]`)?.value||""}));
  saveShared();renderSharedSettings();showToast("共有資料を保存しました");
 };
}
function renderSharedEntryTitle(){
 const row=$("sharedEntryList")?.querySelector(".active .entry-select");
 if(row)row.textContent=sharedEnt()?.title||"無題";
}
function removeSharedField(i){
 const e=sharedEnt();if(!e)return;
 confirmAction("この共有項目を削除しますか？",()=>{e.fields.splice(i,1);saveShared();renderSharedEntryEditor()});
}
function deleteSharedEntry(id){
 const c=sharedCat();if(!c)return;
 const e=c.entries.find(x=>x.id===id);if(!e)return;
 confirmAction(`「${e.title}」を削除しますか？`,()=>{c.entries=c.entries.filter(x=>x.id!==id);if(sharedEntryId===id)sharedEntryId=null;saveShared();renderSharedSettings()});
}
function deleteSharedCategory(id){
 const c=sharedData.categories.find(x=>x.id===id);if(!c)return;
 confirmAction(`カテゴリ「${c.name}」と中の資料を削除しますか？`,()=>{
  sharedData.categories=sharedData.categories.filter(x=>x.id!==id);
  if(sharedCategoryId===id){sharedCategoryId=null;sharedEntryId=null}
  saveShared();renderSharedSettings();
 });
}

/* メモ */
function renderMemo(){
 const x=p(),e=ep();if(!x)return;
 $("projectMemo").value=x.memo||x.plot||"";$("episodeMemo").value=e?(e.memo||e.notes||""):"";
 $("episodeMemo").disabled=!e||isGuideProject();$("projectMemo").disabled=isGuideProject();
 $("episodeMemoLabel").textContent=e?`「${e.title||"無題"}」のメモ`:"エピソード別メモ";
}
$("projectMemo").addEventListener("input",()=>{if(isGuideProject())return;const x=p();if(!x)return;x.memo=$("projectMemo").value;x.plot=x.memo;scheduleSave()});
$("episodeMemo").addEventListener("input",()=>{if(isGuideProject())return;const e=ep();if(!e)return;e.memo=$("episodeMemo").value;e.notes=e.memo;scheduleSave()});

/* 横断検索 */
function openGlobalSearch(){
 if(isGuideProject())return;
 showModal("エピソード横断検索",`<div class="modal-field"><label>検索語</label><input id="globalQuery" placeholder="検索する文字列"></div>
 <div class="modal-field"><label>検索対象</label><select id="globalScope"><option value="all">本文＋設定資料</option><option value="episodes">エピソード本文</option><option value="settings">設定資料</option></select></div>
 <div id="globalResults" class="result-list"></div>`,()=>false,null);
 const query=$("globalQuery"),scope=$("globalScope");
 function run(){
  const q=query.value.trim().toLowerCase(),x=p(),root=$("globalResults");root.innerHTML="";if(!q)return;
  const found=[];
  if(scope.value!=="settings")x.episodes.forEach(e=>{
   const pos=e.body.toLowerCase().indexOf(q);
   if(pos>=0)found.push({kind:"本文",title:e.title,snippet:e.body.slice(Math.max(0,pos-65),Math.min(e.body.length,pos+q.length+100)),open:()=>{
    episodeId=e.id;switchTab("writing");loadEditor();renderEpisodes();renderMemo();renderReferenceEpisodeOptions();$("modalRoot").innerHTML="";
   }});
  });
  if(scope.value!=="episodes")x.categories.forEach(c=>c.entries.forEach(e=>{
   const text=e.title+"\n"+e.fields.map(f=>f.name+"\n"+f.value).join("\n"),pos=text.toLowerCase().indexOf(q);
   if(pos>=0)found.push({kind:"設定",title:e.title,snippet:text.slice(Math.max(0,pos-65),Math.min(text.length,pos+q.length+100)),open:()=>{
    categoryId=c.id;entryId=e.id;switchTab("settings");renderCategories();renderEntryEditor();$("modalRoot").innerHTML="";
   }});
  }));
  if(!found.length){root.innerHTML='<div class="empty">該当箇所がありません。</div>';return}
  found.forEach(item=>{
   const div=document.createElement("div");div.className="search-hit";
   div.innerHTML=`<strong>${esc(item.kind)} ／ ${esc(item.title)}</strong><div class="search-snippet">${esc(item.snippet)}</div>`;
   div.onclick=item.open;root.appendChild(div);
  });
 }
 query.addEventListener("input",run);scope.addEventListener("change",run);query.focus();
}

/* 一括置換 */
function openBulkReplace(){
 if(isGuideProject())return;
 showModal("一括置換",`<div class="modal-field"><label>検索文字列</label><input id="replaceFind"></div>
 <div class="modal-field"><label>置換後</label><input id="replaceTo"></div>
 <div class="modal-field"><label>対象</label><select id="replaceScope"><option value="episodes">エピソード本文</option><option value="settings">設定資料</option><option value="all">本文＋設定資料</option></select></div>
 <p class="muted">置換前にJSONバックアップを保存することをおすすめします。</p>`,()=>{
  const find=$("replaceFind").value,to=$("replaceTo").value,scope=$("replaceScope").value,x=p();
  if(!find){$("replaceFind").focus();return false}
  let count=0;
  if(scope!=="settings")x.episodes.forEach(e=>{const n=e.body.split(find).length-1;if(n){e.body=e.body.split(find).join(to);count+=n}});
  if(scope!=="episodes")x.categories.forEach(c=>c.entries.forEach(e=>e.fields.forEach(f=>{const n=f.value.split(find).length-1;if(n){f.value=f.value.split(find).join(to);count+=n}})));
  save();loadEditor();renderEpisodes();renderCategories();renderReferences();showToast(count+"箇所を置換しました");
 },"置換する");
}

/* 履歴 */
function openHistory(){
 if(isGuideProject())return;const e=ep();if(!e)return;
 showModal("執筆履歴",`<p class="muted">現在のエピソードの本文を履歴として保存できます。履歴はこのブラウザ内に保持されます。</p>
 <button class="primary" id="makeSnapshot">現在の本文を保存</button><div id="historyList" class="result-list"></div>`,()=>false,null);
 function render(){
  const list=historyData[episodeId]||[];
  $("historyList").innerHTML=list.slice().reverse().map(s=>`<div class="search-hit">
   <strong>${esc(new Date(s.time).toLocaleString("ja-JP"))}</strong><div class="search-snippet">${esc(s.title)} ／ ${s.body.length}文字</div>
   <button data-restore="${s.id}" style="margin-top:8px">復元</button></div>`).join("")||'<div class="empty">履歴がありません。</div>';
  $("historyList").querySelectorAll("[data-restore]").forEach(btn=>btn.onclick=()=>{
   const snap=list.find(s=>s.id===btn.dataset.restore);if(!snap)return;
   confirmAction("この履歴を本文に復元しますか？",()=>{
    const target=ep();target.title=snap.title;target.body=snap.body;loadEditor();renderEpisodes();save();$("modalRoot").innerHTML="";showToast("履歴を復元しました");
   });
  });
 }
 $("makeSnapshot").onclick=()=>{
  saveEditor(false);historyData[episodeId]||=[];
  historyData[episodeId].push({id:uid(),time:timestamp(),title:e.title,body:e.body});
  historyData[episodeId]=historyData[episodeId].slice(-10);
  try{localStorage.setItem(BACKUP_KEY,JSON.stringify(historyData))}catch{}
  render();showToast("履歴を保存しました");
 };
 try{historyData=JSON.parse(localStorage.getItem(BACKUP_KEY)||"{}")}catch{historyData={}}
 render();
}

/* JSON/TXT */
function download(name,content,type){
 const a=document.createElement("a"),url=URL.createObjectURL(new Blob([content],{type}));
 a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function filename(s){return String(s||"novel").replace(/[\\/:*?"<>|]/g,"_")}
function exportJSON(){if(isGuideProject())return;saveEditor(false);download(filename(p().name)+".json",JSON.stringify(p(),null,2),"application/json")}
function exportTXT(){if(isGuideProject())return;saveEditor(false);download(filename(p().name)+".txt",p().episodes.map(e=>e.title+"\n\n"+e.body).join("\n\n"+"—".repeat(20)+"\n\n"),"text/plain;charset=utf-8")}
function exportFullBackup(){saveEditor(false);download("write-novel-backup.json",JSON.stringify({version:4,projects},null,2),"application/json")}
$("importFile").addEventListener("change",async ev=>{
 if(isGuideProject()){ev.target.value="";return}
 const file=ev.target.files[0];if(!file)return;
 try{
  const data=JSON.parse(await file.text());let imported=[];
  if(Array.isArray(data.episodes)&&Array.isArray(data.categories))imported=[data];
  else if(Array.isArray(data.projects))imported=data.projects;
  else if(Array.isArray(data))imported=data;
  else throw Error("作品データの形式が違います。");
  imported=imported.map(normalizeProject).filter(Boolean);if(!imported.length)throw Error("読み込める作品がありません。");
  confirmAction("読み込んだ作品を現在の作品一覧に追加しますか？",()=>{
   imported.forEach(x=>{x.id=uid();x.name=(x.name||file.name.replace(/\.json$/i,""))+"（読み込み）";delete x.isGuide});
   projects.unshift(...imported);save();renderHome();openProject(imported[0].id);showToast("作品データを読み込みました");
  });
 }catch(err){alert("読み込みに失敗しました。\n"+err.message)}
 ev.target.value="";
});

/* ゴミ箱 */
function trashTypeName(type){return({project:"作品",episode:"エピソード",entry:"設定資料",field:"設定項目"})[type]||"データ"}
function openTrash(){
 pruneTrash();
 showModal("ゴミ箱",`<p class="muted">削除したデータは10日間保持されます。最大10件まで保存され、上限を超えると古いものから完全削除されます。</p>
 <div id="trashList"></div><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="danger" id="emptyTrashButton">ゴミ箱を空にする</button></div>`,()=>false,null);
 renderTrashList();
 $("emptyTrashButton").onclick=()=>{
  if(!trash.length){showToast("ゴミ箱は空です");return}
  confirmAction("ゴミ箱内のデータをすべて完全削除しますか？",()=>{trash=[];saveTrash();renderTrashList();showToast("ゴミ箱を空にしました")});
 };
}
function renderTrashList(){
 const root=$("trashList");if(!root)return;
 if(!trash.length){root.innerHTML='<div class="empty">ゴミ箱は空です。</div>';updateTrashCount();return}
 root.innerHTML=trash.slice().reverse().map(item=>{
  const expires=new Date(Date.parse(item.deletedAt)+TRASH_DAYS*86400000);
  return `<div class="trash-row"><div class="trash-info"><strong>${esc(item.label)}</strong>
   <div class="muted">${trashTypeName(item.type)} ・ 削除日時：${esc(new Date(item.deletedAt).toLocaleString("ja-JP"))}</div>
   <div class="muted">完全削除予定：${esc(expires.toLocaleString("ja-JP"))}</div></div>
   <div class="trash-actions"><button data-restore-trash="${item.id}">復元</button><button class="danger" data-delete-trash="${item.id}">完全削除</button></div>
  </div>`;
 }).join("");
 root.querySelectorAll("[data-restore-trash]").forEach(btn=>btn.onclick=()=>restoreTrashItem(btn.dataset.restoreTrash));
 root.querySelectorAll("[data-delete-trash]").forEach(btn=>btn.onclick=()=>permanentlyDeleteTrashItem(btn.dataset.deleteTrash));
 updateTrashCount();
}
function restoreTrashItem(id){
 const item=trash.find(t=>t.id===id);if(!item)return;let restored=false;
 if(item.type==="project"){
  if(!projects.some(x=>x.id===item.data.id)){projects.splice(Math.min(item.meta?.index??projects.length,projects.length),0,item.data);restored=true}
 }else if(item.type==="episode"){
  const x=projects.find(x=>x.id===item.meta?.projectId);
  if(x&&!x.episodes.some(e=>e.id===item.data.id)){x.episodes.splice(Math.min(item.meta?.index??x.episodes.length,x.episodes.length),0,item.data);restored=true}
 }else if(item.type==="entry"){
  const x=projects.find(x=>x.id===item.meta?.projectId),c=x?.categories.find(c=>c.id===item.meta?.categoryId);
  if(c&&!c.entries.some(e=>e.id===item.data.id)){c.entries.splice(Math.min(item.meta?.index??c.entries.length,c.entries.length),0,item.data);restored=true}
 }else if(item.type==="field"){
  const x=projects.find(x=>x.id===item.meta?.projectId),c=x?.categories.find(c=>c.id===item.meta?.categoryId),e=c?.entries.find(e=>e.id===item.meta?.entryId);
  if(e){e.fields.splice(Math.min(item.meta?.index??e.fields.length,e.fields.length),0,item.data);restored=true}
 }
 if(!restored){showToast("復元先が見つからないか、同じデータが存在します");return}
 trash=trash.filter(t=>t.id!==id);saveTrash();save();renderTrashList();renderHome();
 if(projectId&&p()){renderEpisodes();renderCategories();renderReferences();renderMemo()}
 showToast("データを復元しました");
}
function permanentlyDeleteTrashItem(id){
 const item=trash.find(t=>t.id===id);if(!item)return;
 confirmAction(`「${item.label}」を完全削除しますか？この操作は取り消せません。`,()=>{
  trash=trash.filter(t=>t.id!==id);saveTrash();renderTrashList();showToast("完全削除しました");
 });
}

/* ダイアログ */
function showModal(title,body,onSubmit,submitLabel="保存"){
 const root=$("modalRoot");
 root.innerHTML=`<div class="modal-bg"><div class="modal"><h2>${esc(title)}</h2><div id="modalBody">${body}</div>
  <div class="modal-actions"><button id="modalCancel">キャンセル</button>${submitLabel===null?"":`<button class="primary" id="modalSubmit">${esc(submitLabel)}</button>`}</div>
 </div></div>`;
 $("modalCancel").onclick=()=>root.innerHTML="";
 if($("modalSubmit"))$("modalSubmit").onclick=()=>{if(onSubmit()!==false)root.innerHTML=""};
 root.querySelector(".modal-bg").addEventListener("click",e=>{if(e.target.classList.contains("modal-bg"))root.innerHTML=""});
}
function confirmAction(message,callback){showModal("確認",`<p>${esc(message)}</p>`,()=>callback(),"実行")}
function openShortcuts(){
 showModal("キーボードショートカット",`<p class="muted">⌘（Command）＋⇧（Shift）を中心に設定しています。ブラウザやiPadOSの標準操作と競合する場合があります。</p>
 <table style="width:100%;line-height:2.5">
 <tr><td>保存</td><td><kbd>⌘</kbd> + <kbd>S</kbd></td></tr>
 <tr><td>横断検索</td><td><kbd>⌘</kbd> + <kbd>⇧</kbd> + <kbd>F</kbd></td></tr>
 <tr><td>新規エピソード</td><td><kbd>⌘</kbd> + <kbd>⇧</kbd> + <kbd>Enter</kbd></td></tr>
 <tr><td>前のエピソード</td><td><kbd>⌘</kbd> + <kbd>⇧</kbd> + <kbd>↑</kbd></td></tr>
 <tr><td>次のエピソード</td><td><kbd>⌘</kbd> + <kbd>⇧</kbd> + <kbd>↓</kbd></td></tr>
 <tr><td>参照パネル切替</td><td><kbd>⌘</kbd> + <kbd>⇧</kbd> + <kbd>R</kbd></td></tr>
 <tr><td>ショートカット一覧</td><td><kbd>⌘</kbd> + <kbd>⇧</kbd> + <kbd>K</kbd></td></tr>
 </table>`,()=>false,null);
}
function moveEpisode(delta){
 const x=p();if(!x)return;const i=x.episodes.findIndex(e=>e.id===episodeId),next=i+delta;
 if(next<0||next>=x.episodes.length)return;selectEpisode(x.episodes[next].id);
}
function handleShortcut(event){
 if(!event.metaKey)return;const key=event.key.toLowerCase();
 if(key==="s"){event.preventDefault();if(!isGuideProject()){saveEditor(false);save();showToast("保存しました")}return}
 if(event.shiftKey&&key==="f"){event.preventDefault();openGlobalSearch();return}
 if(event.shiftKey&&key==="enter"){event.preventDefault();addEpisode();return}
 if(event.shiftKey&&event.key==="ArrowUp"){event.preventDefault();if(!isGuideProject())moveEpisode(-1);return}
 if(event.shiftKey&&event.key==="ArrowDown"){event.preventDefault();if(!isGuideProject())moveEpisode(1);return}
 if(event.shiftKey&&key==="r"){event.preventDefault();toggleReference();return}
 if(event.shiftKey&&key==="k"){event.preventDefault();openShortcuts()}
}
document.addEventListener("keydown",handleShortcut);
window.addEventListener("beforeunload",()=>{try{localStorage.setItem(KEY,JSON.stringify(projects));saveShared()}catch{}});

/* 起動 */
ensureGuideProject();
pruneTrash();
save();
saveShared();
renderHome();
updateTrashCount();

/* オープニング */
function startIntro(){
 const screen=$("introScreen"),title=$("introTitle");if(!screen||!title)return;
 const name="Write-novel",reducedMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
 let index=0;
 function typeNext(){
  if(index<name.length){title.textContent+=name[index++];setTimeout(typeNext,reducedMotion?35:105);return}
  setTimeout(()=>{
   screen.classList.add("is-zooming");
   const finish=()=>screen.classList.add("is-hidden");
   title.addEventListener("animationend",finish,{once:true});
   setTimeout(finish,reducedMotion?350:1100);
  },reducedMotion?180:500);
 }
 typeNext();
}
startIntro();
</script>
