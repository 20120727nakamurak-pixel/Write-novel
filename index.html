<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="manifest" href="./manifest.json">
</head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4efe6">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.json">
<title>Write-novel v1.8</title>
<style>
:root{
  --bg:#f4efe6;--paper:#fffdf8;--panel:#eee6d9;--text:#39362f;
  --muted:#8b8173;--line:#ded4c4;--accent:#69775b;--accent-dark:#4f5d43;
  --soft:#e7ebdf;--danger:#a65b50;--shadow:0 3px 14px #51432b0b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;font-size:14px}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--text);border-radius:7px;padding:8px 11px}
button:hover{background:var(--panel)}
button.primary{background:var(--accent);color:white;border-color:var(--accent)}
button.primary:hover{background:var(--accent-dark)}
button.danger{color:var(--danger)}
button.ghost{background:transparent;border-color:transparent}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px #69775b1c}
textarea{resize:vertical}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:12px}
.small{font-size:12px}
h1,h2,h3,p{margin-top:0}
h1{font-size:24px;font-weight:650;letter-spacing:-.4px;margin-bottom:6px}
h2{font-size:18px;font-weight:650;margin-bottom:0}
h3{font-size:14px;font-weight:650;margin-bottom:0}
.topbar{height:58px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.brand{font-family:Georgia,serif;font-size:20px;font-weight:bold;letter-spacing:-.5px;color:var(--accent-dark)}
.brand-button{border:0;background:transparent;padding:0;color:inherit;font:inherit;letter-spacing:inherit;border-radius:4px}
.brand-button:hover{background:transparent;color:var(--accent)}
.brand-button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.brand span{font-family:system-ui,sans-serif;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:1px;margin-left:7px}
#saveStatus{font-size:12px;color:var(--muted)}
main{max-width:1500px;margin:auto;padding:25px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:15px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-width:0}
.card h3{font-family:Georgia,serif;font-size:18px;white-space:nowrap;overflow:hidden;min-width:0}
.project-title{position:relative;overflow:hidden;width:100%;white-space:nowrap}
.project-title span{display:inline-block;white-space:nowrap;max-width:100%}
.project-title.is-marquee span{max-width:none;padding-right:42px;animation:title-marquee 13s linear infinite}
.project-title.is-marquee:hover span{animation-play-state:paused}
@keyframes title-marquee{0%,12%{transform:translateX(0)}88%,100%{transform:translateX(var(--marquee-distance))}}
.card.guide-card{border-color:#cbd4bf;background:#fbfcf8}
.guide-label{display:inline-flex;align-self:flex-start;padding:3px 8px;border-radius:20px;background:var(--soft);color:var(--accent-dark);font-size:11px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:9px;line-height:1.8}
.workspace{height:calc(100vh - 58px);display:flex;flex-direction:column;min-height:500px}
.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:var(--paper);border-bottom:1px solid var(--line);padding:9px 13px}
.toolbar button{font-size:12px;padding:7px 9px}
.project-name{font-weight:700;margin-right:auto;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:4px}
.tab{border:0;background:transparent;color:var(--muted)}
.tab.active{background:var(--soft);color:var(--accent-dark);font-weight:700}
.editor-layout{display:grid;grid-template-columns:220px minmax(260px,1fr);gap:11px;padding:11px;flex:1;min-height:0;position:relative}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow)}
.panel-head{padding:11px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel-body{padding:11px;overflow:auto;min-height:0}
.episode-list{display:flex;flex-direction:column;gap:5px}
.episode-item{display:flex;gap:4px;position:relative;touch-action:pan-y}
.episode-item.is-dragging{opacity:.45}
.episode-item.drag-target{outline:2px dashed var(--accent);outline-offset:2px}
.episode-item button:first-child{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:none;-webkit-user-select:none;touch-action:none}
.selected{background:var(--soft);color:var(--accent-dark);border-color:#d5ddc9}
.editor{display:flex;flex-direction:column;min-height:0}
#episodeTitle{font-size:20px;font-weight:700;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:15px;background:var(--paper)}
#bodyEditor{flex:1;min-height:150px;border:0;border-radius:0;padding:20px;background:var(--paper);font-family:ui-serif,"Yu Mincho",serif;font-size:17px;line-height:1.95}
.footer{padding:8px 13px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.reference-panel{position:absolute;right:11px;top:11px;bottom:11px;width:320px;z-index:3;box-shadow:0 8px 30px #453a2815}
.reference-tabs{display:flex;gap:5px;align-items:center}
.reference-tabs button{font-size:11px;padding:6px 8px}
.reference-tabs button.active{background:var(--soft);color:var(--accent-dark);border-color:#d5ddc9}
.reference-result{padding:10px;border:1px solid var(--line);border-radius:8px;margin:8px 0;cursor:pointer;background:var(--paper)}
.reference-result:hover{background:var(--panel)}
.reference-result strong{display:block;margin-bottom:4px}
#referenceDetail,#referenceEpisodeBody{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.8;margin-top:12px}
#referenceEpisodeBody{font-family:ui-serif,"Yu Mincho",serif}
.settings-page{padding:16px;overflow:auto;flex:1}
.settings-layout{display:grid;grid-template-columns:210px minmax(280px,1fr);gap:13px;max-width:1250px;margin:auto;align-items:start}
.settings-box{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.category-row{display:flex;align-items:center;border-bottom:1px solid #eee7dc}
.category-row:last-child{border-bottom:0}
.category-button{display:block;flex:1;min-width:0;text-align:left;border:0;border-radius:0}
.category-delete{flex:none;color:var(--danger);border:0;background:transparent;padding:7px 10px}
.category-delete:hover{background:var(--panel)}
.shared-settings-bar{max-width:1250px;margin:0 auto 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;background:var(--soft);border:1px solid #d5ddc9;border-radius:10px}
.shared-settings-bar h2{font-size:17px;margin-bottom:4px}
.shared-settings-bar p{margin:0}
.category-button.active{background:var(--soft);color:var(--accent-dark)}
.category-list{padding:5px 0}
.settings-main{min-width:0}
.settings-main-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}
.settings-main-head h2{font-size:17px}
.entry-list{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px}
.entry-row{display:flex;align-items:center;gap:5px;padding:5px;border:1px solid var(--line);border-radius:8px;background:#fffefa;min-width:0;touch-action:pan-y;transition:transform .16s ease,opacity .16s ease,border-color .16s ease}
.entry-row.swipe-moving{opacity:.72;border-color:var(--accent);transition:none}
.entry-row .entry-select{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.entry-row.active{border-color:#b8c5aa;background:var(--soft)}
.entry-row .entry-select{flex:1;min-width:0;text-align:left;border:0;background:transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.entry-row .entry-select:hover{background:transparent}
.entry-row .entry-delete{flex:none;padding:5px 8px;color:var(--danger);border-color:transparent;background:transparent}
.entry-editor{border-top:1px solid var(--line);padding:17px 18px;background:#fffefa}
.entry-editor-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.entry-editor-top h3{font-size:14px}
.editor-form{max-width:850px}
.field{margin:12px 0}
.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
.field textarea{min-height:95px;line-height:1.7}
.setting-field{padding:13px 0;border-top:1px solid #eee7dc}
.setting-field:first-child{border-top:0}
.setting-field-actions{display:flex;justify-content:flex-end;margin-top:7px}
.add-field-row{margin-top:13px}
.entry-editor-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.settings-empty{padding:22px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
.memo-page{padding:22px;overflow:auto;flex:1}
.memo-wrap{max-width:1000px;margin:auto}
.memo-wrap textarea{min-height:35vh;line-height:1.8;font-family:ui-serif,"Yu Mincho",serif}
.modal-bg{position:fixed;inset:0;background:#28251f66;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}
.modal{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(650px,100%);max-height:88vh;overflow:auto;box-shadow:0 15px 50px #0002}
.modal h2{margin-bottom:16px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.modal-field{margin:12px 0}
.modal-field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
.result-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.search-hit{padding:10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.search-hit:hover{background:var(--panel)}
.search-hit strong{display:block;margin-bottom:5px}
.search-snippet{font-size:12px;color:var(--muted);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
kbd{font-family:inherit;font-size:11px;padding:2px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--panel)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;background:var(--accent-dark);color:white;padding:10px 15px;border-radius:8px;font-size:12px}
mark{background:#e8dfb8;color:inherit}
.guide-notice{padding:9px 13px;background:var(--soft);color:var(--accent-dark);font-size:12px;border-bottom:1px solid var(--line)}
.guide-content{white-space:pre-wrap;overflow-wrap:anywhere}
.guide-content h1,.guide-content h2,.guide-content h3{white-space:normal}
.intro-screen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:var(--bg);overflow:hidden}
.intro-title{display:inline-block;font-family:Georgia,serif;font-size:clamp(34px,7vw,62px);font-weight:bold;letter-spacing:-1.5px;color:var(--accent-dark);white-space:nowrap;transform-origin:center center;will-change:transform,opacity}
.intro-title::after{content:"";display:inline-block;width:2px;height:.88em;margin-left:5px;vertical-align:-.08em;background:var(--accent-dark);animation:intro-caret .8s steps(1,end) infinite}
.intro-screen.is-zooming .intro-title{animation:intro-zoom .9s cubic-bezier(.2,.72,.25,1) forwards}
.intro-screen.is-hidden{display:none}
@keyframes intro-caret{50%{opacity:0}}
@keyframes intro-zoom{0%{transform:scale(1);opacity:1;filter:blur(0)}65%{opacity:1}100%{transform:scale(24);opacity:0;filter:blur(3px)}}
@media(prefers-reduced-motion:reduce){.intro-title::after{animation:none}.intro-screen.is-zooming .intro-title{animation:intro-zoom .15s ease-out forwards}}
.trash-button{box-shadow:0 2px 8px #51432b12}
.trash-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.trash-row:last-child{border-bottom:0}
.trash-info{min-width:0;flex:1}
.trash-info strong{display:block;overflow-wrap:anywhere;margin-bottom:4px}
.trash-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:850px){
 .editor-layout{grid-template-columns:170px minmax(200px,1fr)}
 .reference-panel{width:min(330px,90vw)}
 .settings-layout{grid-template-columns:180px minmax(260px,1fr)}
}
@media(max-width:600px){
 main{padding:14px}
 .editor-layout{grid-template-columns:1fr;grid-template-rows:135px minmax(280px,1fr)}
 .episode-list{flex-direction:row;overflow:auto}
 .episode-item{min-width:150px}
 .settings-layout{grid-template-columns:1fr}
 .settings-category-box .category-list{display:flex;overflow:auto}
 .settings-category-box .category-row{flex:none;border:0}
 .settings-category-box .category-button{width:auto;white-space:nowrap}
 .shared-settings-bar{align-items:flex-start}
 .settings-main-head{align-items:flex-start}
 .entry-list{grid-template-columns:1fr}
 .workspace{height:calc(100vh - 58px)}
 .toolbar{gap:5px}
 .project-name{max-width:100px}

 .trash-row{flex-direction:column}
 .trash-actions{justify-content:flex-start}
}
</style>
</head>
<body>
<div id="introScreen" class="intro-screen" aria-label="Write-novel 起動中">
  <div id="introTitle" class="intro-title" aria-label="Write-novel"></div>
</div>

<header class="topbar">
  <div class="brand"><button class="brand-button" type="button" onclick="returnToHome()">Write-novel</button> <span>v1.8</span></div>
  <div id="saveStatus">保存済み</div>
</header>

<main id="homeView">
  <div class="head">
    <div>
      <h1>作品ホーム</h1>
      <div class="muted">作品を選んで執筆を始めよう。</div>
    </div>
    <div class="actions">
      <button onclick="openSharedSettings(true)">全作品共有設定</button>
      <button class="primary" onclick="createProject()">＋ 新しい作品</button>
    </div>
  </div>
  <div id="projectGrid" class="grid"></div>
</main>

<section id="workspace" class="workspace hidden">
  <div class="toolbar">
    <button onclick="showHome()">← ホーム</button>
    <div id="projectName" class="project-name"></div>
    <button id="sharedSettingsButton" onclick="openSharedSettings(false)">全作品共有設定</button>
    <div class="tabs">
      <button id="writingTab" class="tab active" onclick="switchTab('writing')">執筆</button>
      <button id="settingsTab" class="tab" onclick="switchTab('settings')">設定</button>
      <button id="memoTab" class="tab" onclick="switchTab('memo')">メモ</button>
    </div>
    <button id="referenceToggle" onclick="toggleReference()">参照パネル</button>
    <button id="globalSearchButton" onclick="openGlobalSearch()">横断検索</button>
    <button id="bulkReplaceButton" onclick="openBulkReplace()">一括置換</button>
    <button id="historyButton" onclick="openHistory()">履歴</button>
    <button onclick="openShortcuts()">ショートカット</button>
    <button id="trashButton" class="trash-button" onclick="openTrash()">ゴミ箱 <span id="trashCount">0</span></button>
    <button id="exportJSONButton" onclick="exportJSON()">JSON保存</button>
    <button id="exportTXTButton" onclick="exportTXT()">TXT保存</button>
    <button id="importJSONButton" onclick="$('importFile').click()">JSON読込</button>
    <input id="importFile" type="file" accept=".json,application/json" class="hidden">
  </div>

  <div id="guideNotice" class="guide-notice hidden">
    これはWrite-novelの使い方を紹介するガイド作品です。内容の編集・削除はできません。
  </div>

  <div id="writingView" class="editor-layout">
    <aside class="panel">
      <div class="panel-head">
        <h3>エピソード</h3>
        <button id="addEpisodeButton" onclick="addEpisode()">＋</button>
      </div>
      <div class="panel-body">
        <div id="episodeList" class="episode-list"></div>
      </div>
    </aside>

    <section class="panel editor">
      <input id="episodeTitle" placeholder="エピソードタイトル">
      <textarea id="bodyEditor" placeholder="ここから執筆…" spellcheck="false"></textarea>
      <div class="footer">
        <span id="wordCount">0文字</span>
        <span id="episodeSaveStatus">自動保存</span>
      </div>
    </section>

    <aside id="referencePanel" class="panel reference-panel hidden">
      <div class="panel-head">
        <div class="reference-tabs">
          <button id="refSettingsTab" class="active" onclick="switchReferenceTab('settings')">設定検索</button>
          <button id="refEpisodesTab" onclick="switchReferenceTab('episodes')">話を参照</button>
        </div>
        <button class="ghost" onclick="toggleReference(false)">×</button>
      </div>
      <div class="panel-body">
        <div id="referenceSettingsPane">
          <input id="referenceSearch" placeholder="設定名・内容を検索">
          <div id="referenceResults"></div>
          <div id="referenceDetail"></div>
        </div>
        <div id="referenceEpisodesPane" class="hidden">
          <select id="referenceEpisodeSelect"></select>
          <h3 id="referenceEpisodeTitle" style="margin-top:12px">エピソード参照</h3>
          <div id="referenceEpisodeBody" class="muted">別のエピソードを選択してください。</div>
        </div>
      </div>
    </aside>
  </div>

  <section id="settingsView" class="settings-page hidden">
    <div id="sharedSettingsBar" class="shared-settings-bar hidden">
      <div>
        <h2>全作品共有設定</h2>
        <p class="muted">ここに登録した資料は、すべての作品で共通して管理されます。作品ごとの設定欄には表示されません。</p>
      </div>
      <button onclick="closeSharedSettings()">戻る</button>
    </div>
    <div class="settings-layout">
      <aside class="settings-box settings-category-box">
        <div class="panel-head">
          <h3>カテゴリ</h3>
          <button id="addCategoryButton" onclick="addCategory()">＋</button>
        </div>
        <div id="categoryList" class="category-list"></div>
      </aside>

      <section class="settings-box settings-main">
        <div class="settings-main-head">
          <h2 id="settingsHeading">人物</h2>
          <button id="addEntryButton" class="primary" onclick="addEntry()">＋ 資料を追加</button>
        </div>
        <div id="entryList" class="entry-list"></div>
        <div id="entryEditor" class="entry-editor hidden"></div>
      </section>
    </div>
  </section>

  <section id="memoView" class="memo-page hidden">
    <div class="memo-wrap">
      <h2>執筆メモ</h2>
      <p class="muted" style="margin:7px 0 18px">作品全体のアイデア、伏線、展開案など。</p>
      <div class="field">
        <label>作品全体のメモ</label>
        <textarea id="projectMemo" placeholder="物語全体についてのメモ…"></textarea>
      </div>
      <div class="field">
        <label id="episodeMemoLabel">エピソード別メモ</label>
        <textarea id="episodeMemo" placeholder="このエピソードの修正予定や展開案…"></textarea>
      </div>
    </div>
  </section>
</section>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
"use strict";

const KEY="write-novel-v03";
const BACKUP_KEY="write-novel-v04-backup";
const GUIDE_ID="write-novel-guide-v11";
const TRASH_KEY="write-novel-v12-trash";
const SHARED_SETTINGS_KEY="write-novel-v13-shared-settings";
const TRASH_MAX=10;
const TRASH_DAYS=10;

let projects=load();
let trash=loadTrash();
let sharedSettings=loadSharedSettings();
let sharedSettingsMode=false,sharedReturnToHome=false,sharedReturnTab="writing";
let sharedCategoryId=null,sharedEntryId=null;
let projectId=null,episodeId=null,categoryId=null,entryId=null;
let saveTimer=null,referenceOpen=false,referenceTab="settings",referenceEpisodeId=null;
let historyData={};

const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const timestamp=()=>new Date().toISOString();

function esc(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function load(){
 try{
  const raw=JSON.parse(localStorage.getItem(KEY)||"[]");
  if(Array.isArray(raw))return raw;
  if(raw&&Array.isArray(raw.projects))return raw.projects;
  return [];
 }catch{return []}
}
function loadTrash(){
 try{
  const data=JSON.parse(localStorage.getItem(TRASH_KEY)||"[]");
  return Array.isArray(data)?data:[];
 }catch{return []}
}
function loadSharedSettings(){
 try{
  const data=JSON.parse(localStorage.getItem(SHARED_SETTINGS_KEY)||"null");
  if(data&&Array.isArray(data.categories))return data;
 }catch{}
 return {categories:[]};
}
function saveSharedSettings(){
 try{
  localStorage.setItem(SHARED_SETTINGS_KEY,JSON.stringify(sharedSettings));
  $("saveStatus").textContent="共有設定を保存済み";
 }catch{
  $("saveStatus").textContent="保存失敗";
  alert("共有設定の保存領域が不足しています。");
 }
}

function saveTrash(){
 localStorage.setItem(TRASH_KEY,JSON.stringify(trash));
 updateTrashCount();
}

function pruneTrash(){
 const cutoff=Date.now()-TRASH_DAYS*24*60*60*1000;
 trash=trash.filter(item=>Date.parse(item.deletedAt)>cutoff);
 trash.sort((a,b)=>Date.parse(a.deletedAt)-Date.parse(b.deletedAt));
 while(trash.length>TRASH_MAX)trash.shift();
 saveTrash();
}

function addToTrash(type,label,data,meta={}){
 pruneTrash();
 trash.push({
  id:uid(),type,label:String(label||"削除データ"),
  data:JSON.parse(JSON.stringify(data)),
  meta,deletedAt:timestamp()
 });
 trash.sort((a,b)=>Date.parse(a.deletedAt)-Date.parse(b.deletedAt));
 while(trash.length>TRASH_MAX)trash.shift();
 saveTrash();
}

function ensureGuideProject(){

 }

function normalizeProject(x){
 if(!x||typeof x!=="object")return null;
 x.id ||= uid();x.name ||= "無題の作品";
 if(!Array.isArray(x.episodes))x.episodes=[];
 if(!Array.isArray(x.categories))x.categories=[];
 x.plot=typeof x.plot==="string"?x.plot:"";
 x.memo=typeof x.memo==="string"?x.memo:"";
 x.episodes.forEach(e=>{
  e.id ||= uid();e.title??="無題";
  e.body=typeof e.body==="string"?e.body:"";
  e.notes=typeof e.notes==="string"?e.notes:"";
  e.memo=typeof e.memo==="string"?e.memo:e.notes;
 });
 x.categories.forEach(c=>{
  c.id ||= uid();c.name ||= "その他";
  if(!Array.isArray(c.entries))c.entries=[];
  c.entries.forEach(e=>{
   e.id ||= uid();e.title ||= "無題の設定";
   if(!Array.isArray(e.fields))e.fields=[];
   e.fields.forEach(f=>{f.name??="項目";f.value=typeof f.value==="string"?f.value:""});
  });
 });
 if(!x.episodes.length)x.episodes.push({id:uid(),title:"第1話",body:"",notes:"",memo:""});
 return x;
}

function enableEpisodeReordering(){
 const list=$("episodeList");
 if(list.dataset.reorderReady==="1")return;
 list.dataset.reorderReady="1";
 let pressTimer=null,dragging=null,pointerId=null,startX=0,startY=0,moved=false;
 const clearDrag=()=>{
  if(pressTimer)clearTimeout(pressTimer);
  pressTimer=null;
  if(dragging){
   dragging.classList.remove("is-dragging");
   list.querySelectorAll(".drag-target").forEach(el=>el.classList.remove("drag-target"));
  }
  dragging=null;pointerId=null;moved=false;
 };
 list.addEventListener("pointerdown",event=>{
  const handle=event.target.closest(".episode-item button:first-child");
  if(!handle||isGuideProject())return;
  const item=handle.closest(".episode-item");
  if(!item)return;
  startX=event.clientX;startY=event.clientY;moved=false;pointerId=event.pointerId;
  pressTimer=setTimeout(()=>{
   dragging=item;dragging.classList.add("is-dragging");
   try{handle.setPointerCapture(pointerId)}catch{}
  },380);
 });
 list.addEventListener("pointermove",event=>{
  if(pointerId!==event.pointerId)return;
  if(!dragging){
   if(Math.hypot(event.clientX-startX,event.clientY-startY)>12){
    if(pressTimer)clearTimeout(pressTimer);
    pressTimer=null;
   }
   return;
  }
  event.preventDefault();moved=true;
  const target=document.elementFromPoint(event.clientX,event.clientY)?.closest(".episode-item");
  list.querySelectorAll(".drag-target").forEach(el=>el.classList.remove("drag-target"));
  if(!target||target===dragging)return;
  target.classList.add("drag-target");
  const horizontal=getComputedStyle(list).flexDirection==="row";
  const rect=target.getBoundingClientRect();
  const before=horizontal?event.clientX<rect.left+rect.width/2:event.clientY<rect.top+rect.height/2;
  if(before)list.insertBefore(dragging,target);
  else list.insertBefore(dragging,target.nextSibling);
 });
 const finish=()=>{
  if(!dragging){clearDrag();return}
  const ordered=[...list.querySelectorAll(".episode-item")].map(el=>el.dataset.episodeId);
  const x=p();
  if(x&&!isGuideProject()&&ordered.length===x.episodes.length){
   const byId=new Map(x.episodes.map(e=>[e.id,e]));
   x.episodes=ordered.map(id=>byId.get(id)).filter(Boolean);
   saveEditor(false);save();renderEpisodes();renderReferenceEpisodeOptions();
   showToast("エピソードの順番を保存しました");
  }
  clearDrag();
 };
 list.addEventListener("pointerup",event=>{if(pointerId===event.pointerId)finish()});
 list.addEventListener("pointercancel",event=>{if(pointerId===event.pointerId)clearDrag()});
}

function renderReferences(){
 const x=p();if(!x)return;const q=$("referenceSearch").value.trim().toLowerCase();const hits=[];
 x.categories.forEach(c=>c.entries.forEach(e=>{
  const text=[c.name,e.title,...e.fields.flatMap(f=>[f.name,f.value])].join(" ");

let entrySwipeState=null;
let suppressEntryClickUntil=0;
function enableEntrySwipeReordering(){
 const list=$("entryList");
 if(list.dataset.swipeReady==="1")return;
 list.dataset.swipeReady="1";
 list.addEventListener("pointerdown",event=>{
  const row=event.target.closest(".entry-row");
  if(!row||event.target.closest(".entry-delete")||isGuideProject())return;
  entrySwipeState={id:row.dataset.entryId,pointerId:event.pointerId,startX:event.clientX,startY:event.clientY,horizontal:false};
 });
 document.addEventListener("pointermove",event=>{
  const state=entrySwipeState;
  if(!state||event.pointerId!==state.pointerId)return;
  const dx=event.clientX-state.startX,dy=event.clientY-state.startY;
  if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.2){
   state.horizontal=true;
   const row=[...list.querySelectorAll(".entry-row")].find(el=>el.dataset.entryId===state.id);
   if(row){row.classList.add("swipe-moving");row.style.transform=`translateX(${dx}px)`}
   event.preventDefault();
  }
 },{passive:false});
 document.addEventListener("pointerup",event=>{
  const state=entrySwipeState;
  if(!state||event.pointerId!==state.pointerId)return;
  entrySwipeState=null;
  const dx=event.clientX-state.startX,dy=event.clientY-state.startY;
  const row=[...list.querySelectorAll(".entry-row")].find(el=>el.dataset.entryId===state.id);
  if(row){row.classList.remove("swipe-moving");row.style.transform=""}
  if(state.horizontal&&Math.abs(dx)>=45&&Math.abs(dx)>Math.abs(dy)*1.2){
   suppressEntryClickUntil=Date.now()+450;
   reorderEntryBySwipe(state.id,dx<0?1:-1);
  }
 },true);
 document.addEventListener("pointercancel",event=>{
  if(!entrySwipeState||event.pointerId!==entrySwipeState.pointerId)return;
  const state=entrySwipeState;entrySwipeState=null;
  const row=[...list.querySelectorAll(".entry-row")].find(el=>el.dataset.entryId===state.id);
  if(row){row.classList.remove("swipe-moving");row.style.transform=""}
 },true);
 list.addEventListener("click",event=>{
  if(Date.now()<suppressEntryClickUntil&&event.target.closest(".entry-select")){
   event.preventDefault();event.stopPropagation();
  }
 },true);
}

 if(isGuideProject())return;
 const c=cat();if(!c)return;
 const index=c.entries.findIndex(e=>e.id===id),next=index+direction;
 if(index<0||next<0||next>=c.entries.length){showToast(direction<0?"これ以上前には移動できません":"これ以上後ろには移動できません");return}
 [c.entries[index],c.entries[next]]=[c.entries[next],c.entries[index]];
 renderEntryList();scheduleSave();
 showToast("資料の順番を変更しました");
}

function renderTrashList(){
 const root=$("trashList");if(!root)return;
 if(!trash.length){root.innerHTML='<div class="empty">ゴミ箱は空です。</div>';updateTrashCount();return}
 root.innerHTML=trash.slice().reverse().map(item=>{
  const expires=new Date(Date.parse(item.deletedAt)+TRASH_DAYS*86400000);
  return `<div class="trash-row">
   <div class="trash-info"><strong>${esc(item.label)}</strong>
    <div class="muted">${trashTypeName(item.type)} ・ 削除日時：${esc(new Date(item.deletedAt).toLocaleString("ja-JP"))}</div>

    <button class="danger" data-delete-trash="${item.id}">完全削除</button>
   </div>
  </div>`;
 }).join("");
 root.querySelectorAll("[data-restore-trash]").forEach(btn=>btn.onclick=()=>restoreTrashItem(btn.dataset.restoreTrash));
 root.querySelectorAll("[data-delete-trash]").forEach(btn=>btn.onclick=()=>permanentlyDeleteTrashItem(btn.dataset.deleteTrash));
 updateTrashCount();
}
function restoreTrashItem(id){
 const item=trash.find(t=>t.id===id);if(!item)return;
 let restored=false;
 if(item.type==="project"){
  if(!projects.some(x=>x.id===item.data.id)){
   const index=Math.min(item.meta?.index??projects.length,projects.length);
   projects.splice(index,0,item.data);restored=true;
  }
 }else if(item.type==="episode"){
  const project=projects.find(x=>x.id===item.meta?.projectId);
  if(project&&!project.episodes.some(e=>e.id===item.data.id)){
   const index=Math.min(item.meta?.index??project.episodes.length,project.episodes.length);
   project.episodes.splice(index,0,item.data);restored=true;
  }
 }else if(item.type==="category"){
  if(item.meta?.shared){
   if(!sharedSettings.categories.some(c=>c.id===item.data.id)){
    const index=Math.min(item.meta?.index??sharedSettings.categories.length,sharedSettings.categories.length);
    sharedSettings.categories.splice(index,0,item.data);restored=true;
   }
  }else{
   const project=projects.find(x=>x.id===item.meta?.projectId);
   if(project&&!project.categories.some(c=>c.id===item.data.id)){
    const index=Math.min(item.meta?.index??project.categories.length,project.categories.length);
    project.categories.splice(index,0,item.data);restored=true;
   }
  }
 }else if(item.type==="entry"){
  if(item.meta?.shared){
   const category=sharedSettings.categories.find(c=>c.id===item.meta?.categoryId);
   if(category&&!category.entries.some(e=>e.id===item.data.id)){
    const index=Math.min(item.meta?.index??category.entries.length,category.entries.length);
    category.entries.splice(index,0,item.data);restored=true;
   }
  }else{
   const project=projects.find(x=>x.id===item.meta?.projectId);
   const category=project?.categories.find(c=>c.id===item.meta?.categoryId);
   if(category&&!category.entries.some(e=>e.id===item.data.id)){
    const index=Math.min(item.meta?.index??category.entries.length,category.entries.length);
    category.entries.splice(index,0,item.data);restored=true;
   }
  }
 }else if(item.type==="field"){
  if(item.meta?.shared){
   const category=sharedSettings.categories.find(c=>c.id===item.meta?.categoryId);
   const entry=category?.entries.find(e=>e.id===item.meta?.entryId);
   if(entry){
    const index=Math.min(item.meta?.index??entry.fields.length,entry.fields.length);
    entry.fields.splice(index,0,item.data);restored=true;
   }
  }else{
   const project=projects.find(x=>x.id===item.meta?.projectId);
   const category=project?.categories.find(c=>c.id===item.meta?.categoryId);
   const entry=category?.entries.find(e=>e.id===item.meta?.entryId);
   if(entry){
    const index=Math.min(item.meta?.index??entry.fields.length,entry.fields.length);
    entry.fields.splice(index,0,item.data);restored=true;
   }
  }
 }
 if(!restored){
  showToast("復元先が見つからないか、同じデータが存在します");return;
 }
 trash=trash.filter(t=>t.id!==id);saveTrash();
 if(item.meta?.shared){saveSharedSettings();if(sharedSettingsMode)renderCategories();}
 else save();
 renderTrashList();
 if(!item.meta?.shared||!sharedSettingsMode)renderHome();
 if(projectId&&p()&&!item.meta?.shared){
  renderEpisodes();renderCategories();renderReferences();renderMemo();
 }
 showToast("データを復元しました");
}
function permanentlyDeleteTrashItem(id){
 const item=trash.find(t=>t.id===id);if(!item)return;
 confirmAction(`「${item.label}」を完全削除しますか？この操作は取り消せません。`,()=>{
  trash=trash.filter(t=>t.id!==id);saveTrash();renderTrashList();showToast("完全削除しました");
 });
}

/* ダイアログ */
function showModal(title,body,onSubmit,submitLabel="保存"){
 const root=$("modalRoot");
 root.innerHTML=`<div class="modal-bg"><div class="modal"><h2>${esc(title)}</h2><div id="modalBody">${body}</div>
  <div class="modal-actions"><button id="modalCancel">キャンセル</button>
  ${submitLabel===null?"":`<button class="primary" id="modalSubmit">${esc(submitLabel)}</button>`}</div></div></div>`;
 $("modalCancel").onclick=()=>root.innerHTML="";
 if($("modalSubmit"))$("modalSubmit").onclick=()=>{if(onSubmit()!==false)root.innerHTML=""};
 root.querySelector(".modal-bg").addEventListener("click",e=>{if(e.target.classList.contains("modal-bg"))root.innerHTML=""});
}
function confirmAction(message,callback){
 showModal("確認",`<p>${esc(message)}</p>`,()=>callback(),"実行");
}
function openShortcuts(){
 showModal("キーボードショートカット",`<p class="muted">⌘（Command）＋⇧（Shift）を中心に設定しています。ブラウザやiPadOSの標準操作と競合する場合があります。</p>
 <table style="width:100%;line-height:2.5">
 <tr><td>保存</td><td><kbd>⌘</kbd> + <kbd>S</kbd></td></tr>
 <tr><td>横断検索</td><td><kbd>⌘</kbd> + <kbd>⇧</kbd> + <kbd>F</kbd></td></tr>
 <tr><td>新規エピソード</td><td><kbd>⌘</kbd> + <kbd>⇧</kbd> + <kbd>Enter</kbd></td></tr>
 <tr><td>参照パネル切替</td><td><kbd>⌘</kbd> + <kbd>⇧</kbd> + <kbd>R</kbd></td></tr>
 <tr><td>なろう形式ルビ</td><td><kbd>⌘</kbd> + <kbd>⇧</kbd> + <kbd>1</kbd></td></tr>
 <tr><td>なろう形式傍点</td><td><kbd>⌘</kbd> + <kbd>⇧</kbd> + <kbd>2</kbd></td></tr>
 <tr><td>カクヨム形式ルビ</td><td><kbd>⌘</kbd> + <kbd>⇧</kbd> + <kbd>5</kbd></td></tr>
 <tr><td>カクヨム形式傍点</td><td><kbd>⌘</kbd> + <kbd>⇧</kbd> + <kbd>6</kbd></td></tr>
 <tr><td>ショートカット一覧</td><td><kbd>⌘</kbd> + <kbd>⇧</kbd> + <kbd>K</kbd></td></tr>
 </table><p class="muted">⌘ + ⇧ + ↑ / ↓ はOS側の文字選択操作と競合するため、アプリのショートカットには設定していません。</p>`,()=>false,null);
}
function openFormatInput(format){
 if(isGuideProject()||$("writingView").classList.contains("hidden"))return;
 const editor=$("bodyEditor");
 const start=editor.selectionStart,end=editor.selectionEnd;
 const formats={
  narouRuby:{title:"なろう形式ルビ",needsRuby:true,build:(base,ruby)=>`|${base}(${ruby})`},
  narouDots:{title:"なろう形式傍点",needsRuby:false,build:base=>`|${base}(${Array.from(base).map(()=> "・").join("")})`},
  kakuyomuRuby:{title:"カクヨム形式ルビ",needsRuby:true,build:(base,ruby)=>`|${base}《${ruby}》`},
  kakuyomuDots:{title:"カクヨム形式傍点",needsRuby:false,build:base=>`《《${base}》》`}
 };
 const config=formats[format];if(!config)return;
 const fields=`<label>媒体文字<input id="formatBase" type="text" autocomplete="off" placeholder="例：如月"></label>
 ${config.needsRuby?`<label style="display:block;margin-top:12px">ルビ文字<input id="formatRuby" type="text" autocomplete="off" placeholder="例：キサラギ"></label>`:""}`;
 showModal(config.title,fields,()=>{
  const base=$("formatBase").value;
  const ruby=config.needsRuby?$("formatRuby").value:"";
  if(!base.trim()||(config.needsRuby&&!ruby.trim())){
   showToast("必要な文字を入力してください");return false;
  }
  const text=config.needsRuby?config.build(base,ruby):config.build(base);
  editor.focus();
  editor.setRangeText(text,start,end,"end");
  saveEditor();
  return true;
 },"挿入");
}
function moveEpisode(delta){
 const x=p();if(!x)return;const i=x.episodes.findIndex(e=>e.id===episodeId),next=i+delta;
 if(next<0||next>=x.episodes.length)return;selectEpisode(x.episodes[next].id);
}
/* ショートカット実行前に、現在の文字入力状態を必ず終了する */
function forceEndTextInput(){
 const active=document.activeElement;
 if(!active)return;
 if(active.matches("input,textarea,select")||active.isContentEditable){
  active.blur();
 }
}
function handleShortcut(event){
 if(!event.metaKey)return;
 const key=event.key.toLowerCase();
 let action=null;
 if(key==="s"){
  action=()=>{if(!isGuideProject()){saveEditor(false);save();showToast("保存しました")}};
 }else if(event.shiftKey&&key==="f"){
  action=()=>openGlobalSearch();
 }else if(event.shiftKey&&key==="enter"){
  action=()=>addEpisode();
 }else if(event.shiftKey&&key==="r"){
  action=()=>toggleReference();
 }else if(event.shiftKey&&key==="k"){
  action=()=>openShortcuts();
 }else if(event.shiftKey&&event.code==="Digit1"){
  action=()=>openFormatInput("narouRuby");
 }else if(event.shiftKey&&event.code==="Digit2"){
  action=()=>openFormatInput("narouDots");
 }else if(event.shiftKey&&event.code==="Digit5"){
  action=()=>openFormatInput("kakuyomuRuby");
 }else if(event.shiftKey&&event.code==="Digit6"){
  action=()=>openFormatInput("kakuyomuDots");
 }
 if(!action)return;
 /* ショートカットを入力欄へ伝播させず、文字の誤入力を防ぐ */
 event.preventDefault();
 event.stopPropagation();
 event.stopImmediatePropagation();
 forceEndTextInput();
 action();
}
document.addEventListener("keydown",handleShortcut,true);
window.addEventListener("beforeunload",()=>{
 try{localStorage.setItem(KEY,JSON.stringify(projects))}catch{}
 try{localStorage.setItem(SHARED_SETTINGS_KEY,JSON.stringify(sharedSettings))}catch{}
});

/* 起動 */
ensureGuideProject();
pruneTrash();
save();
renderHome();
updateTrashCount();

/* オープニング */
let introTimers=[];
function startIntro(){
 const screen=$("introScreen"),title=$("introTitle");if(!screen||!title)return;
 introTimers.forEach(timer=>clearTimeout(timer));introTimers=[];
 screen.classList.remove("is-hidden","is-zooming");
 title.textContent="";
 /* 既存のズーム状態を確実に解除してから、同じ演出を再生する */
 void screen.offsetWidth;
 const name="Write-novel";
 const reducedMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
 let index=0;
 function later(callback,delay){introTimers.push(setTimeout(callback,delay));}
 function finish(){screen.classList.add("is-hidden");screen.classList.remove("is-zooming");}
 function typeNext(){
  if(index<name.length){title.textContent+=name[index++];later(typeNext,reducedMotion?35:105);return}
  later(()=>{
   screen.classList.add("is-zooming");
   title.addEventListener("animationend",finish,{once:true});
   later(finish,reducedMotion?350:1100);
  },reducedMotion?180:500);
 }
 typeNext();
}
startIntro();
</script>
